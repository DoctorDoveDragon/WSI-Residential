<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Well Spring Intervention LLC — Circular Seal: URL outside, House around enlarged Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    margin: 0; padding: 0;
  }
  .poster {
    width: 1900px;
    height: 1900px;
    background: #faeddc; /* warm cream parchment, matches v6f icon */
    position: relative;
    overflow: hidden;
  }

  /* SVG layers — two of them:
     - seal-svg-bottom: URL ring + hairlines + ornaments (BENEATH icon)
     - seal-svg-top:    house pentagon (ON TOP of icon, so walls/floor
                        are not hidden by the icon's opaque background) */
  .seal-svg {
    position: absolute;
    top: 0; left: 0;
    width: 1900px;
    height: 1900px;
    pointer-events: none;
  }

  /* Centered CROPPED icon — between the two SVG layers.
     Uses Well_Spring_Logo_Icon_Cropped.png (791×902, content centered
     with only 15px symmetric padding — 96% content fill).

     Displayed at 1070×1220px (enlarged from 1035×1180 per VLM feedback).
     Content is 1029×1180, spanning (436,360) to (1464,1540).
     - Side margin: 56px (5.4% of content width — SNUG)
     - Bottom margin: 10px (very snug)
     - Top: 10px below roof peak (very snug)

     The canopy extends into the roof zone. The roof lines (drawn ON TOP)
     cross the canopy edges — reads as house "sheltering" the tree.

     No content-shift needed: cropped icon has content centered in frame. */
  .icon-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 1070px;
    height: 1220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap img {
    width: 1070px;
    height: 1220px;
    object-fit: contain;
    display: block;
  }

  /* URL text style — 66px (enlarged in SOP-30), walnut-brown */
  .url-text {
    font-family: 'Cormorant Garamond', 'Times New Roman', serif;
    font-weight: 500;
    font-size: 66px;
    letter-spacing: 14px;
    fill: #6b4d3f; /* deep walnut brown */
  }
</style>
</head>
<body>
  <div class="poster">

    <!-- ====================================================== -->
    <!-- BOTTOM SVG: URL ring + hairlines + ornaments            -->
    <!-- ====================================================== -->
    <svg class="seal-svg" viewBox="0 0 1900 1900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="url-circle"
              d="M 60,950 a 890,890 0 1,1 1780,0 a 890,890 0 1,1 -1780,0"
              fill="none" />
      </defs>

      <!-- Outer hairline circle r=920 -->
      <circle cx="950" cy="950" r="920"
              fill="none" stroke="#6b4d3f" stroke-width="1.5" opacity="0.34" />

      <!-- URL text on circle r=890 (OUTSIDE the house) -->
      <text class="url-text" x="0" y="0">
        <textPath href="#url-circle" startOffset="25%" text-anchor="middle">
          www.wellspringintervention.com
        </textPath>
      </text>

      <!-- Inner hairline circle r=860 -->
      <circle cx="950" cy="950" r="860"
              fill="none" stroke="#6b4d3f" stroke-width="1.5" opacity="0.34" />

      <!-- Terracotta accent dots at 9:00 and 3:00 -->
      <circle cx="60" cy="950" r="8" fill="#ab5125" opacity="0.85" />
      <circle cx="1840" cy="950" r="8" fill="#ab5125" opacity="0.85" />

      <!-- Bottom ornament at 6:00 -->
      <circle cx="950" cy="1840" r="10" fill="#ab5125" opacity="0.85" />
      <line x1="850" y1="1840" x2="710" y2="1840"
            stroke="#6b4d3f" stroke-width="1.5" opacity="0.42" />
      <line x1="1050" y1="1840" x2="1190" y2="1840"
            stroke="#6b4d3f" stroke-width="1.5" opacity="0.42" />
      <circle cx="695" cy="1840" r="5" fill="#ab5125" opacity="0.65" />
      <circle cx="1205" cy="1840" r="5" fill="#ab5125" opacity="0.65" />
    </svg>

    <!-- ====================================================== -->
    <!-- MIDDLE LAYER: Cropped + enlarged logo icon              -->
    <!-- (1035×1180px, content fills 96% of frame)               -->
    <!-- ====================================================== -->
    <div class="icon-wrap">
      <img src="/home/z/my-project/download/Well_Spring_Logo_Icon_Cropped.png"
           alt="Multi-color logo icon (cropped to content): tree of life, wellspring, family figures" />
    </div>

    <!-- ====================================================== -->
    <!-- TOP SVG: HOUSE OUTLINE (5 lines) — ENLARGED to contain  -->
    <!-- the logo with canopy in the body (roof above canopy).    -->
    <!--                                                          -->
    <!-- Geometry (25px margin around logo content):              -->
    <!--   Walls: x=411, x=1489 (width 1078)                     -->
    <!--   Floor: y=1565                                          -->
    <!--   Wall tops: y=335 (above canopy top 360 → canopy in body) -->
    <!--   Roof peak: (950, 135), rise 200px, angle ~20.4°       -->
    <!--   All vertices inside inner hairline r=860 (42px clear)  -->
    <!--                                                          -->
    <!-- The roof sits ABOVE the tree canopy — no overlap. The    -->
    <!-- house fully contains the logo with a small margin.       -->
    <!-- 12.5px stroke, full opacity                              -->
    <!-- ====================================================== -->
    <svg class="seal-svg" viewBox="0 0 1900 1900" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#6b4d3f" stroke-width="12.5" opacity="1.0" fill="none"
         stroke-linecap="round" stroke-linejoin="round">
        <!-- Line 1: FLOOR -->
        <line x1="411" y1="1565" x2="1489" y2="1565" />
        <!-- Line 2: LEFT WALL -->
        <line x1="411" y1="1565" x2="411" y2="335" />
        <!-- Line 3: LEFT ROOF -->
        <line x1="411" y1="335" x2="950" y2="135" />
        <!-- Line 4: RIGHT ROOF -->
        <line x1="950" y1="135" x2="1489" y2="335" />
        <!-- Line 5: RIGHT WALL -->
        <line x1="1489" y1="335" x2="1489" y2="1565" />
      </g>
    </svg>

  </div>
</body>
</html>
