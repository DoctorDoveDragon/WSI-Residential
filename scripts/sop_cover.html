<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Well Spring Intervention LLC — SOP Manual Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --c-bg:        #f4f4f3;
    --c-section:   #eeedec;
    --c-card:      #f0edec;
    --c-stripe:    #f3f2f1;
    --c-header:    #6b4d3f;
    --c-block:     #6a5145;
    --c-border:    #beb0a9;
    --c-icon:      #955b3e;
    --c-accent:    #ab5125;
    --c-accent2:   #d15287;
    --c-text:      #1e1c1b;
    --c-muted:     #87807d;
    /* Warm earthy tones sampled from the illustration's edges */
    --c-band-top:  #3a1f12;
    --c-band-bot:  #2a1810;
    --c-cream:     #ffd9a8;
    --c-cream-soft: rgba(255, 251, 247, 0.92);
  }

  @page {
    size: 794px 1123px;
    margin: 0;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--c-band-bot);
    width: 794px;
    height: 1123px;
    font-family: 'Inter', sans-serif;
    color: var(--c-text);
  }

  .poster {
    position: relative;
    width: 794px;
    height: 1123px;
    background: var(--c-band-bot);
    overflow: hidden;
  }

  /* ── Layout regions ─────────────────────────────────────────────
     The cover is divided into three vertical regions:
       1. Top band    (0 → 320px, 320px tall)    — branding text
       2. Image band  (320 → 773px, 453px tall)  — full horizontal brand image
       3. Bottom band (773 → 1123px, 350px tall) — document identification
     The image band height (453px) is computed from the source image's
     natural aspect ratio (1344:768 = 1.75:1) at 794px page width:
     794 × (768/1344) = 453px. This ensures the image is shown in FULL
     with no cropping, exactly matching the standalone brand PNG. */

  .band-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 320px;
    background:
      linear-gradient(to bottom,
        var(--c-band-top) 0%,
        var(--c-band-top) 70%,
        #2a1810 100%);
    z-index: 2;
  }

  .band-image {
    position: absolute;
    top: 320px;
    left: 0;
    right: 0;
    height: 453px;
    background: #2a1810;
    z-index: 1;
    overflow: hidden;
  }
  .band-image img {
    display: block;
    width: 100%;
    height: 100%;
    /* object-fit:contain ensures the FULL image is visible (no cropping).
       The image fills the band exactly because the band's aspect ratio
       matches the image's natural aspect ratio (794:453 ≈ 1344:768). */
    object-fit: contain;
    object-position: center center;
  }

  .band-bottom {
    position: absolute;
    top: 773px;
    left: 0;
    right: 0;
    height: 350px;
    background:
      linear-gradient(to bottom,
        #2a1810 0%,
        var(--c-band-bot) 30%,
        var(--c-band-bot) 100%);
    z-index: 2;
  }

  /* ── Top band content ─────────────────────────────────────────── */
  .top-content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 56px 64px 24px 64px;
    color: #fff;
    text-align: center;
  }
  .top-content .kicker {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--c-cream);
    margin-bottom: 28px;
  }
  .top-content .kicker .badge {
    display: inline-block;
    margin-right: 12px;
    padding: 5px 12px;
    background: var(--c-accent);
    border-radius: 2px;
    color: #fff;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 9.5px;
  }
  .top-content .hero {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 56px;
    line-height: 1.05;
    color: #fff;
    letter-spacing: -1px;
    margin-bottom: 6px;
  }
  .top-content .hero .row2 {
    color: var(--c-cream);
  }
  .top-content .subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--c-cream-soft);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 10px;
  }
  .top-content .tagline {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255, 251, 247, 0.7);
    margin-top: 16px;
  }

  /* ── Bottom band content ──────────────────────────────────────── */
  /* Versioning is private — no Doc ID, Revision, RMDM-Compliance, or Owner
     appears on the public-facing cover. That information lives only in
     the PDF metadata, the About This Manual inside page, body page
     headers, the Version History table, and Form 6 — all internal. */
  .bottom-content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 44px 64px 56px 64px;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }
  .bottom-content .accent-rule {
    width: 60px;
    height: 2px;
    background: var(--c-accent);
    margin-bottom: 22px;
  }
  .bottom-content .doc-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.2;
    color: #fff;
    margin-bottom: 6px;
  }
  .bottom-content .doc-subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--c-cream);
  }
</style>
</head>
<body>
<div class="poster">

  <!-- Top band: branding -->
  <div class="band-top">
    <div class="top-content">
      <div class="kicker">
        <span class="badge">SOP / OPERATIONAL MANUAL</span>
        Standard Operating Procedure &amp; Operational Reference
      </div>
      <div class="hero">
        Well Spring <span class="row2">Intervention</span> LLC
      </div>
      <div class="subtitle">Level 3 Supervised Residential Group Home</div>
      <div class="tagline">
        Empowerment &nbsp;&middot;&nbsp; Growth &nbsp;&middot;&nbsp; Freedom &nbsp;&middot;&nbsp; Health &nbsp;&middot;&nbsp; Wholeness &nbsp;&middot;&nbsp; Healing
      </div>
    </div>
  </div>

  <!-- Image band: FULL horizontal brand image (no cropping, matches standalone PNG exactly) -->
  <div class="band-image">
    <img src="sop_cover_image.png" alt="Symbolic illustration of a tree-human figure rising toward a sunrise over calm water, evoking empowerment, growth, freedom, health, wholeness, and healing" />
  </div>

  <!-- Bottom band: document title only (versioning is private) -->
  <div class="band-bottom">
    <div class="bottom-content">
      <div class="accent-rule"></div>
      <div class="doc-title">SOP &amp; Operational Manual</div>
      <div class="doc-subtitle">Standard Operating Procedures, Protocols &amp; Forms</div>
    </div>
  </div>

</div>
</body>
</html>
