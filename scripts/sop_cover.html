<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Well Spring Intervention LLC — SOP Manual Cover (v9, seal)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --c-bg:        #f4f4f3;
    --c-section:   #eeedec;
    --c-card:      #f0edec;
    --c-stripe:    #f3f2f1;
    --c-header:    #6b4d3f;
    --c-block:     #6a5145;
    --c-border:    #beb0a9;
    --c-icon:      #955b3e;
    --c-accent:    #ab5125;
    --c-accent2:   #d15287;
    --c-text:      #1e1c1b;
    --c-muted:     #87807d;
    /* Warm earthy tones sampled from the illustration's edges */
    --c-band-top:  #3a1f12;
    --c-band-bot:  #2a1810;
    --c-cream:     #ffd9a8;
    --c-cream-soft: rgba(255, 251, 247, 0.92);
  }

  @page {
    size: 794px 1123px;
    margin: 0;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--c-band-bot);
    width: 794px;
    height: 1123px;
    font-family: 'Inter', sans-serif;
    color: var(--c-text);
  }

  .poster {
    position: relative;
    width: 794px;
    height: 1123px;
    background: var(--c-band-bot);
    overflow: hidden;
  }

  /* ── Layout regions (v9 — seal as centerpiece) ──────────────────
     The cover is divided into three vertical regions:
       1. Top band    (0 → 150px,  150px tall)  — document kicker only
       2. Seal band   (150 → 870px, 720px tall) — square brand seal, centered
       3. Bottom band (870 → 1123px, 253px tall) — document title + tagline
     The seal (2600×2600 source PNG) is rendered at ~680×680px centered
     in the 720px-tall seal band, with the cream parchment square popping
     against the dark background. The company name "Well Spring Intervention
     LLC" appears on the seal's top arc — no need to repeat it as text. */

  .band-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 150px;
    background:
      linear-gradient(to bottom,
        var(--c-band-top) 0%,
        var(--c-band-top) 70%,
        #2a1810 100%);
    z-index: 2;
  }

  .band-seal {
    position: absolute;
    top: 150px;
    left: 0;
    right: 0;
    height: 720px;
    background: var(--c-band-bot);
    z-index: 1;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .band-seal img {
    display: block;
    width: 680px;
    height: 680px;
    /* object-fit:contain keeps the full square seal visible */
    object-fit: contain;
    object-position: center center;
  }

  .band-bottom {
    position: absolute;
    top: 870px;
    left: 0;
    right: 0;
    height: 253px;
    background:
      linear-gradient(to bottom,
        #2a1810 0%,
        var(--c-band-bot) 30%,
        var(--c-band-bot) 100%);
    z-index: 2;
  }

  /* ── Top band content ─────────────────────────────────────────── */
  .top-content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 38px 64px 18px 64px;
    color: #fff;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .top-content .kicker {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--c-cream);
    margin-bottom: 14px;
  }
  .top-content .kicker .badge {
    display: inline-block;
    margin-right: 12px;
    padding: 5px 12px;
    background: var(--c-accent);
    border-radius: 2px;
    color: #fff;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 9.5px;
  }
  .top-content .tagline {
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255, 251, 247, 0.62);
    margin-top: 0;
  }

  /* ── Bottom band content ──────────────────────────────────────── */
  /* Versioning is private — no Doc ID, Revision, RMDM-Compliance, or Owner
     appears on the public-facing cover. That information lives only in
     the PDF metadata, the About This Manual inside page, body page
     headers, the Version History table, and Form 6 — all internal. */
  .bottom-content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 38px 64px 44px 64px;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }
  .bottom-content .accent-rule {
    width: 60px;
    height: 2px;
    background: var(--c-accent);
    margin-bottom: 18px;
  }
  .bottom-content .doc-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.2;
    color: #fff;
    margin-bottom: 6px;
  }
  .bottom-content .doc-subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--c-cream);
    margin-bottom: 14px;
  }
  .bottom-content .url-line {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    color: rgba(255, 251, 247, 0.55);
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="poster">

  <!-- Top band: document kicker (company name is on the seal itself) -->
  <div class="band-top">
    <div class="top-content">
      <div class="kicker">
        <span class="badge">SOP / OPERATIONAL MANUAL</span>
        Standard Operating Procedure &amp; Operational Reference
      </div>
      <div class="tagline">
        Empowerment &nbsp;&middot;&nbsp; Growth &nbsp;&middot;&nbsp; Freedom &nbsp;&middot;&nbsp; Health &nbsp;&middot;&nbsp; Wholeness &nbsp;&middot;&nbsp; Healing
      </div>
    </div>
  </div>

  <!-- Seal band: SQUARE brand seal as the centerpiece (replaces horizontal brand image) -->
  <div class="band-seal">
    <img src="sop_cover_image_v9_seal.png" alt="Well Spring Intervention LLC circular brand seal — house outline enclosing tree of life, wellspring, and family figures, with the company name on the top arc and 'Residential' on the bottom arc inside the circle" />
  </div>

  <!-- Bottom band: document title (versioning is private) -->
  <div class="band-bottom">
    <div class="bottom-content">
      <div class="accent-rule"></div>
      <div class="doc-title">SOP &amp; Operational Manual</div>
      <div class="doc-subtitle">Standard Operating Procedures, Protocols &amp; Forms</div>
      <div class="url-line">www.wellspringintervention.com</div>
    </div>
  </div>

</div>
</body>
</html>
