<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Well Spring Intervention LLC — Logo Lockup (Residential Seal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    margin: 0; padding: 0;
  }
  .poster {
    width: 1792px;
    height: 560px;
    background: #faeddc; /* warm cream parchment, matches v6f icon + seal */
    display: flex;
    align-items: center;
    padding: 0 80px 0 64px;
    gap: 56px;
  }
  .icon-wrap {
    width: 420px;
    height: 420px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap img {
    width: 420px;
    height: 420px;
    object-fit: contain;
    display: block;
  }
  .wordmark {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: #6b4d3f;
  }
  .wordmark-main {
    font-family: 'Cormorant Garamond', 'Times New Roman', serif;
    font-weight: 600;
    font-size: 112px;
    line-height: 1.0;
    letter-spacing: 0.5px;
    color: #6b4d3f; /* deep walnut brown, matches figure */
  }
  .wordmark-main .accent {
    color: #ab5125; /* terracotta accent, matches vessel ornamentation */
  }
  .wordmark-sub {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #6b4d3f;
    margin-top: 18px;
    opacity: 0.78;
    line-height: 1.4;
  }
  .wordmark-sub-2 {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6b4d3f;
    margin-top: 10px;
    opacity: 0.62;
    line-height: 1.45;
  }
  .wordmark-sub-2 .dot {
    color: #ab5125;
    margin: 0 8px;
    opacity: 0.9;
  }
  .wordmark-tag {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    font-size: 22px;
    font-style: italic;
    color: #ab5125; /* terracotta accent */
    margin-top: 16px;
    letter-spacing: 1px;
  }
  .wordmark-email {
    font-family: 'Cormorant Garamond', 'Times New Roman', serif;
    font-weight: 500;
    font-size: 30px;
    color: #6b4d3f; /* deep walnut brown */
    margin-top: 20px;
    letter-spacing: 0.5px;
  }
  .wordmark-email .at {
    color: #ab5125; /* terracotta accent on the @ */
  }
  .divider {
    width: 60px;
    height: 2px;
    background: #ab5125;
    margin-top: 22px;
    margin-bottom: 0;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="icon-wrap">
      <img src="/home/z/my-project/download/Well_Spring_Logo_Circular_Seal.png" alt="Circular residential seal: house-shaped frame containing the tree-of-life wellspring with three family figures, surrounded by an outer ring reading 'Well Spring Intervention LLC' (top arc) and 'Residential' (bottom arc), with website URL below" />
    </div>
    <div class="wordmark">
      <div class="wordmark-main">Well Spring <span class="accent">Intervention</span></div>
      <div class="divider"></div>
      <div class="wordmark-sub">Level III Residential Treatment Facility &middot; Staff-Secure</div>
      <div class="wordmark-sub-2">Outpatient Therapy <span class="dot">&middot;</span> Case Management <span class="dot">&middot;</span> Psychosocial Rehabilitation<br>Child &amp; Adolescent Day Treatment</div>
      <div class="wordmark-tag">Empowerment &middot; Growth &middot; Freedom &middot; Health &middot; Wholeness &middot; Healing</div>
      <div class="wordmark-email">referral<span class="at">@</span>wellspringintervention.com</div>
    </div>
  </div>
</body>
</html>
