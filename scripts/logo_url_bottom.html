<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Well Spring Intervention LLC — Logo with Website URL Below</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    margin: 0; padding: 0;
  }
  .poster {
    width: 1100px;
    height: 1500px;
    background: #fcefdc; /* warm cream parchment, matches v6e icon */
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 90px 60px 110px 60px;
  }

  /* Icon at the top, centered horizontally */
  .icon-wrap {
    width: 980px;
    height: 980px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-wrap img {
    width: 980px;
    height: 980px;
    object-fit: contain;
    display: block;
  }

  /* Decorative divider between icon and URL: two hairline rules with a terracotta dot */
  .divider {
    margin-top: 56px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .divider .rule {
    width: 120px;
    height: 1.5px;
    background: #6b4d3f;
    opacity: 0.42;
  }
  .divider .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ab5125;
    opacity: 0.85;
  }

  /* Website URL — lowercase Cormorant Garamond, walnut-brown.
     Sized to fit within 1100px canvas: 30 chars × ~32px advance width = ~960px */
  .url {
    margin-top: 36px;
    font-family: 'Cormorant Garamond', 'Times New Roman', serif;
    font-weight: 500;
    font-size: 56px;
    letter-spacing: 4px;
    color: #6b4d3f; /* deep walnut brown */
    text-align: center;
    white-space: nowrap;
    /* visually re-center after letter-spacing */
    text-indent: 4px;
  }
</style>
</head>
<body>
  <div class="poster">

    <div class="icon-wrap">
      <img src="/home/z/my-project/download/Well_Spring_Logo_Icon.png"
           alt="Multi-color minimalist logo icon: a tree of life rises from a stone basin wellspring at the base with aqua-blue water bubbling up, its canopy forms a heart shape with green leaves, and three terracotta family figures (adult woman, adult man, child) stand beneath holding hands — warm cream background" />
    </div>

    <div class="divider">
      <span class="rule"></span>
      <span class="dot"></span>
      <span class="rule"></span>
    </div>

    <div class="url">www.wellspringintervention.com</div>

  </div>
</body>
</html>
