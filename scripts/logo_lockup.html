<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Well Spring Intervention LLC — Logo Lockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    margin: 0; padding: 0;
  }
  .poster {
    width: 1792px;
    height: 512px;
    background: #f5ead6; /* warm cream parchment, matches icon */
    display: flex;
    align-items: center;
    padding: 0 80px 0 64px;
    gap: 56px;
  }
  .icon-wrap {
    width: 420px;
    height: 420px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap img {
    width: 420px;
    height: 420px;
    object-fit: contain;
    display: block;
  }
  .wordmark {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: #6b4d3f;
  }
  .wordmark-main {
    font-family: 'Cormorant Garamond', 'Times New Roman', serif;
    font-weight: 600;
    font-size: 96px;
    line-height: 1.0;
    letter-spacing: 0.5px;
    color: #6b4d3f; /* deep walnut brown, matches figure */
  }
  .wordmark-main .accent {
    color: #ab5125; /* terracotta accent, matches vessel ornamentation */
  }
  .wordmark-sub {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #6b4d3f;
    margin-top: 18px;
    opacity: 0.78;
  }
  .wordmark-tag {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    font-size: 16px;
    font-style: italic;
    color: #ab5125; /* terracotta accent */
    margin-top: 14px;
    letter-spacing: 1px;
  }
  .divider {
    width: 60px;
    height: 2px;
    background: #ab5125;
    margin-top: 22px;
    margin-bottom: 0;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="icon-wrap">
      <img src="/home/z/my-project/download/Well_Spring_Logo_Icon.png" alt="Engraved vintage logo icon: Aquarius pouring water from an ornate vessel into a grey stone heart" />
    </div>
    <div class="wordmark">
      <div class="wordmark-main">Well Spring <span class="accent">Intervention</span></div>
      <div class="divider"></div>
      <div class="wordmark-sub">Level 3 Supervised Residential Group Home</div>
      <div class="wordmark-tag">Empowerment &middot; Growth &middot; Freedom &middot; Health &middot; Wholeness &middot; Healing</div>
    </div>
  </div>
</body>
</html>
